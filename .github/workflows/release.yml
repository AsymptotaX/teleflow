name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Teleflow for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Check Rust version
        run: rustc --version

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev:arm64 gcc-aarch64-linux-gnu
          else
            sudo apt-get install -y pkg-config libssl-dev
          fi

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if ! brew list openssl@3 &>/dev/null; then
            brew install openssl@3
          else
            echo "openssl@3 is already installed"
          fi

      - name: Build release binary
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package binary
        shell: bash {0}
        run: |
          mkdir dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/teleflow.exe dist/
            cd dist
            7z a teleflow-${{ matrix.target }}.zip teleflow.exe
          else
            cp target/${{ matrix.target }}/release/teleflow dist/
            cd dist
            zip teleflow-${{ matrix.target }}.zip teleflow
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/teleflow-${{ matrix.target }}.zip